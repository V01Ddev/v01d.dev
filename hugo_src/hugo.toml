baseURL = 'https://v01d.dev/blog'
locale = 'en-us'
title = 'Blog'
publishDir = "../blog"

[[menus.main]]
name = 'Blog'
pageRef = '/blog'
weight = 10

[markup]
  [markup.highlight]
    style = 'tokyonight-night'
  # Drives the contents sidebar on every post (layouts/partials/toc.html).
  # h2 and their h3 children only; deeper headings stay out of the sidebar.
  [markup.tableOfContents]
    startLevel = 2
    endLevel = 3
    ordered = false
